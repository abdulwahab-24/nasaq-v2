    <script>
      (function () {
        var html = document.documentElement;
        html.classList.add('js');
        // The opening intro plays once per session and never under reduced motion. It is decided
        // here, before the first paint, so the stylesheet holds the navigation and the hero's symbol
        // back from frame one (components/layout/intro.css). JS reads the same decision: INTRO in
        // src/motion/gsap.js.
        try {
          if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !sessionStorage.getItem('nasaq-intro')) {
            sessionStorage.setItem('nasaq-intro', '1');
            html.classList.add('is-intro', 'is-intro-mark');
          }
        } catch (e) {}
      })();
    </script>
